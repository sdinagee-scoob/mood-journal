<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood Poetry & Journal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="fullscreen-view" class="fullscreen-overlay" style="display: none;">
    <button id="close-btn" class="close-btn">← Back to Journal</button>
    <div id="fullscreen-poem" class="fullscreen-text" style="white-space: pre-wrap;"></div>
</div>
    <div class="container">
        <!-- Left Side: Mood & Poetry -->
        <section class="mood-section">
            <h1>How are you feeling today?</h1>
            <div class="mood-buttons">
                <button>Happy</button>
                <button>Romantic</button>
                <button>Yearning</button>
                <button>Grief</button>
                <button>Anger</button>
                <button>Uncertain</button>
                <button>Hopeful</button>
                <button>Healing</button>
            </div>
            <div class="poetry-display">
                <p id="quote-box" style="white-space: pre-wrap;">Select a mood</p>
            </div>
        </section>

        <!-- Right Side: Journal -->
        <section class="journal-section">
            <h2>My Journal</h2>
            <textarea placeholder="Write your thoughts here..."></textarea>
            <button class="save-btn">Save Entry</button>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
